# sshd servers for the viperssh end-to-end tests; driven by tests/e2e/run.sh.
# Every login is bob / hunter2 (a local account, or an IPA one on ipa).
# Ports are bound to localhost only.
name: viperssh-e2e

x-rocky: &rocky
  build:
    context: .
    dockerfile: Dockerfile.rocky
    secrets: [extra_ca]
  image: viperssh-e2e-rocky

# CA of a TLS-inspection proxy for dnf, if any (run.sh sets EXTRA_CA_CERT)
secrets:
  extra_ca:
    file: ${EXTRA_CA_CERT:-/dev/null}

services:
  # Jump host; reaches the others by service name
  bastion:
    <<: *rocky
    ports: ["127.0.0.1:2220:22"]

  # Password auth: a forced change runs in the session after login
  rhel:
    <<: *rocky
    environment:
      PASSWORD_STATE: expired
    ports: ["127.0.0.1:2221:22"]

  # Keyboard-interactive: a forced change runs inside the login itself
  rhel-kbd:
    <<: *rocky
    environment:
      PASSWORD_STATE: expired
      SSHD_OPTS: -o KbdInteractiveAuthentication=yes
    ports: ["127.0.0.1:2222:22"]

  ubuntu:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
    image: viperssh-e2e-ubuntu
    environment:
      PASSWORD_STATE: expired
    ports: ["127.0.0.1:2223:22"]

  # FreeIPA server that also takes SSH logins for IPA users (sssd/pam_sss),
  # as an IPA-joined host would. Port 22 has IPA's sshd settings (keyboard-
  # interactive), 2222 is password auth only. Only started by "run.sh up ipa";
  # the first start runs ipa-server-install, which takes a few minutes.
  # It runs systemd, which needs a writable cgroup tree (the Docker VM's), and
  # IPA's RAM check can't read its limit from there, hence --skip-mem-check.
  ipa:
    profiles: [ipa]
    build:
      context: .
      dockerfile: Dockerfile.ipa
      secrets: [extra_ca]
    image: viperssh-e2e-ipa
    hostname: ipa.example.test
    networks:
      default:
        aliases: [ipa.example.test]
    cgroup: host
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
    environment:
      ADMIN_PASSWORD: Secret123-admin
    command: [ipa-server-install, -U, -r, EXAMPLE.TEST, --no-ntp, --skip-mem-check, -p, Secret123-dm, -a, Secret123-admin]
    tty: true
    volumes:
      - ipa-data:/data
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports: ["127.0.0.1:2224:22", "127.0.0.1:2225:2222"]

volumes:
  ipa-data:
